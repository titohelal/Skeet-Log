<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Skeet Log</title>
<meta name="description" content="ISSF skeet training log: target-level misses, weaknesses, mental check-ins and evidence-based insights.">
<meta name="theme-color" content="#EDF0EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1311" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Skeet Log">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:500;font-display:swap;src:url("fonts/barlow-condensed-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:600;font-display:swap;src:url("fonts/barlow-condensed-latin-600-normal.woff2") format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:700;font-display:swap;src:url("fonts/barlow-condensed-latin-700-normal.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:400;font-display:swap;src:url("fonts/ibm-plex-sans-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:500;font-display:swap;src:url("fonts/ibm-plex-sans-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:600;font-display:swap;src:url("fonts/ibm-plex-sans-latin-600-normal.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:400;font-display:swap;src:url("fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:500;font-display:swap;src:url("fonts/ibm-plex-mono-latin-500-normal.woff2") format("woff2")}
:root{
  --bg:#EDF0EE; --surface:#FFFFFF; --surface2:#F5F7F6; --ink:#15201C; --ink2:#44534D; --muted:#6F7F78; --line:#D6DDD9; --line2:#E6EBE8;
  --accent:#C9531C; --accent-ink:#FFFFFF; --accent-soft:#F7E3D8;
  --train:#2F6DB5; --comp:#C9531C;
  --hit:#2B7F52; --hit-soft:#E1F1E8; --miss:#C23A2E; --miss-soft:#FBE3DF; --warn:#9A6A12; --warn-soft:#F6ECD5;
  --div-neg:#C2412D; --div-mid:#DADFDC; --div-pos:#2F6DB5;
  --shadow:0 1px 2px rgba(21,32,28,.06),0 8px 24px rgba(21,32,28,.06);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0D1311; --surface:#151D1A; --surface2:#1B2521; --ink:#E6EDEA; --ink2:#B2C0BA; --muted:#80908A; --line:#2A3632; --line2:#222D29;
  --accent:#E0682F; --accent-ink:#140A05; --accent-soft:#3A2116;
  --train:#5B93D6; --comp:#E0682F;
  --hit:#4DBE83; --hit-soft:#16301F; --miss:#F0675C; --miss-soft:#3A1B18; --warn:#E0B458; --warn-soft:#352A12;
  --div-neg:#EC6A55; --div-mid:#39443F; --div-pos:#5B93D6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1311; --surface:#151D1A; --surface2:#1B2521; --ink:#E6EDEA; --ink2:#B2C0BA; --muted:#80908A; --line:#2A3632; --line2:#222D29;
  --accent:#E0682F; --accent-ink:#140A05; --accent-soft:#3A2116;
  --train:#5B93D6; --comp:#E0682F;
  --hit:#4DBE83; --hit-soft:#16301F; --miss:#F0675C; --miss-soft:#3A1B18; --warn:#E0B458; --warn-soft:#352A12;
  --div-neg:#EC6A55; --div-mid:#39443F; --div-pos:#5B93D6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.app{max-width:760px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:14px 10px;border-bottom:1px solid var(--line2)}
.brand{display:flex;align-items:baseline;gap:8px;flex:1;min-width:0}
.brand b{font:700 22px/1 var(--f-display);letter-spacing:.02em;text-transform:uppercase}
.brand span{font:500 11px/1 var(--f-mono);color:var(--muted);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:500;font-size:14px;min-height:40px}
.btn:hover{border-color:var(--ink2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.danger{color:var(--miss);border-color:var(--miss)}
.btn.block{width:100%;min-height:52px;font-size:16px;border-radius:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font:600 11px/1 var(--f-body);letter-spacing:.04em;text-transform:uppercase}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in oklab,var(--warn) 40%,transparent);padding:10px 12px;border-radius:var(--r);font-size:13.5px;margin-top:14px}
.banner b{color:var(--warn)}
.filters{display:flex;gap:8px;overflow-x:auto;padding-block:12px 4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters select,.filters input{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 28px 7px 12px;font-size:13px;font-weight:500;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat;flex:0 0 auto}
.filters input{padding-right:12px;background-image:none}
.filters .on{border-color:var(--accent);color:var(--accent)}
.fsum{font:12px/1.4 var(--f-mono);color:var(--muted);padding-block:2px 6px}
section.blk{margin-top:22px}
h2.sec{font:700 13px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);margin:0 0 10px;display:flex;align-items:center;gap:8px}
h2.sec small{font:400 12px/1 var(--f-mono);letter-spacing:0;text-transform:none;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line2);border-radius:14px;padding:16px}
.hero{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;align-items:end}
.hero .big{font:700 76px/.85 var(--f-display);letter-spacing:-.01em}
.hero .big small{font-size:30px;color:var(--muted);font-weight:600}
.hero .meta{font:13px/1.5 var(--f-mono);color:var(--ink2);padding-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1px;background:var(--line2);border:1px solid var(--line2);border-radius:14px;overflow:hidden}
.stat{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .k{font:600 11px/1.3 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat .v{font:600 28px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.stat .v small{font-size:16px;color:var(--muted);font-weight:500}
.stat .n{font:11.5px/1.3 var(--f-mono);color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.legend i.line{width:18px;height:2px;border-radius:2px;vertical-align:3px}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg text{fill:var(--muted);font:11px var(--f-mono)}
.axis{stroke:var(--line);stroke-width:1}
.grid-l{stroke:var(--line2);stroke-width:1}
.list{display:flex;flex-direction:column;gap:1px;background:var(--line2);border:1px solid var(--line2);border-radius:14px;overflow:hidden}
.row{background:var(--surface);padding:12px 14px;display:flex;gap:12px;align-items:center;min-width:0}
button.row{border:0;text-align:left;width:100%}
button.row:hover{background:var(--surface2)}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600}
.row .s{font-size:12.5px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;font:600 11px/1 var(--f-body);letter-spacing:.05em;text-transform:uppercase;padding:4px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.pill.comp{border-color:color-mix(in oklab,var(--comp) 50%,transparent);color:var(--comp)}
.pill.train{border-color:color-mix(in oklab,var(--train) 50%,transparent);color:var(--train)}
.pill.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.pill.bad{background:var(--miss-soft);border-color:transparent;color:var(--miss)}
.pill.good{background:var(--hit-soft);border-color:transparent;color:var(--hit)}
.mini{display:flex;gap:2px;align-items:center;flex-wrap:nowrap}
.mini i{width:7px;height:14px;border-radius:2px;background:var(--hit-soft);border:1px solid color-mix(in oklab,var(--hit) 35%,transparent)}
.mini i.m{background:var(--miss);border-color:var(--miss)}
.mini b{width:4px}
.score{font:700 30px/1 var(--f-display);font-variant-numeric:tabular-nums;min-width:40px;text-align:right}
.muted{color:var(--muted)}
.fab{position:fixed;right:max(16px,calc(50% - 364px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:25;box-shadow:var(--shadow);min-height:52px;padding:0 20px;font-size:15px}
.empty{padding:18px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);font-size:14px}
.empty b{color:var(--ink2)}
/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line2);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line2);white-space:nowrap}
th{font:600 11px/1.2 var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);background:var(--surface2)}
td.num,th.num{text-align:right}
tr:last-child td{border-bottom:0}
tbody tr[data-act]{cursor:pointer}
tbody tr[data-act]:hover td{background:var(--surface2)}
/* sheet */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet .in{max-width:760px;margin:0 auto;padding:0 16px calc(120px + env(safe-area-inset-bottom,0px))}
.sheet .bar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:10px;border-bottom:1px solid var(--line2)}
.sheet .bar h1{font:700 20px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.03em;margin:0;flex:1;min-width:0}
.sheet .bar h1 small{display:block;font:500 12px/1.3 var(--f-mono);color:var(--muted);text-transform:none;letter-spacing:0}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:55;background:linear-gradient(to top,var(--bg) 70%,transparent);padding:18px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.foot .in2{max-width:728px;margin:0 auto;display:flex;gap:10px}
/* forms */
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font:600 12px/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:15px;width:100%}
.field textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 13px;font-size:14px;font-weight:500;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
details.fold{background:var(--surface);border:1px solid var(--line2);border-radius:14px}
details.fold>summary{list-style:none;padding:14px 16px;font-weight:600;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"+";font:500 20px/1 var(--f-mono);color:var(--muted)}
details.fold[open]>summary::after{content:"–"}
details.fold>.body{padding:0 16px 16px;display:flex;flex-direction:column;gap:14px}
.scale{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.scale .lab{font-size:14px;color:var(--ink2)}
.scale .opts{display:flex;gap:4px}
.scale .opts button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font:600 15px/1 var(--f-mono)}
.scale .opts button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* round entry */
.entryhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:14px 6px}
.entryhead .sc{font:700 84px/.8 var(--f-display);font-variant-numeric:tabular-nums}
.entryhead .sc small{font-size:32px;color:var(--muted)}
.entryhead .hint{font-size:13px;color:var(--muted);text-align:right;max-width:210px}
.strip{display:grid;grid-template-columns:repeat(25,1fr);gap:2px;margin-block:6px 14px}
.strip i{height:8px;border-radius:2px;background:var(--hit-soft)}
.strip i.m{background:var(--miss)}
.visits{display:flex;flex-direction:column;gap:8px}
.visit{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line2);border-radius:14px;padding:8px 10px}
.visit .st{font:700 30px/1 var(--f-display);text-align:center}
.visit .st small{display:block;font:500 9.5px/1.1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tg{display:flex;flex-wrap:wrap;gap:8px}
.pair{display:flex;gap:2px;padding:2px;border-radius:12px;background:var(--line2)}
.tgt{min-width:62px;height:50px;border-radius:10px;border:1.5px solid color-mix(in oklab,var(--hit) 45%,var(--line));background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font:700 17px/1 var(--f-display);letter-spacing:.03em;color:var(--ink);transition:background .08s}
.pair .tgt{border-radius:9px}
.tgt small{font:500 9.5px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tgt .mk{font:600 11px/1 var(--f-mono);color:var(--hit)}
.tgt[aria-pressed="true"]{background:var(--miss);border-color:var(--miss);color:#fff}
.tgt[aria-pressed="true"] small,.tgt[aria-pressed="true"] .mk{color:#fff}
/* review */
.bigscore{font:700 96px/.85 var(--f-display);font-variant-numeric:tabular-nums}
.bigscore small{font-size:36px;color:var(--muted)}
.miss{background:var(--surface);border:1px solid var(--line2);border-radius:14px;overflow:hidden}
.miss>summary{list-style:none;display:flex;gap:10px;align-items:center;padding:12px 14px;cursor:pointer}
.miss>summary::-webkit-details-marker{display:none}
.miss .x{flex:0 0 28px;height:28px;border-radius:8px;background:var(--miss);color:#fff;display:grid;place-items:center;font:700 14px/1 var(--f-mono)}
.miss .body{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:6px 11px;font-size:13px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.callout{border-left:3px solid var(--accent);background:var(--surface);border-radius:0 12px 12px 0;padding:12px 14px}
.callout .k{font:600 11px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
/* weakness */
.field-map{max-width:520px;margin:0 auto}
.stn{cursor:pointer}
.stn:focus-visible circle.ring{stroke:var(--accent);stroke-width:3}
.stn circle.dot{stroke:var(--surface);stroke-width:3}
.stn text.n{fill:var(--ink);font:700 16px var(--f-display)}
.stn text.r{fill:var(--ink2);font:500 11px var(--f-mono)}
.stn.sel circle.ring{stroke:var(--ink);stroke-width:2}
.dotplot .ci{stroke:var(--ink2);stroke-width:2;stroke-linecap:round}
.dotplot .pt{fill:var(--ink)}
.flag{font:600 10.5px/1 var(--f-body);letter-spacing:.05em;text-transform:uppercase}
/* insights */
.ins{background:var(--surface);border:1px solid var(--line2);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.ins .cat{font:700 11px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.ins p{margin:0;font-size:15.5px;line-height:1.45;font-weight:500;max-width:62ch}
.ins ul{margin:0;padding-left:18px;color:var(--ink2);font-size:13px;display:flex;flex-direction:column;gap:3px}
.ins.empty p{color:var(--muted);font-weight:400}
.pat{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line2);border-radius:14px;padding:14px}
.pat .tag{flex:0 0 auto}
.note{background:var(--surface);border:1px solid var(--line2);border-radius:12px;padding:10px 12px;font-size:14px}
.note .m{font:12px var(--f-mono);color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:10px}
.kpis3{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line2);border:1px solid var(--line2);border-radius:14px;overflow:hidden}
.kpis3 .stat .v{font-size:32px}
.bar-h{height:8px;border-radius:4px;background:var(--line2);overflow:hidden}
.bar-h i{display:block;height:100%;background:var(--ink2);border-radius:4px}
#tip{position:fixed;z-index:90;pointer-events:none;background:var(--ink);color:var(--bg);font:12px/1.35 var(--f-mono);padding:6px 9px;border-radius:8px;max-width:260px;box-shadow:var(--shadow)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:95;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;box-shadow:var(--shadow)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--miss-soft);padding:10px 12px;border-radius:12px;font-size:14px}
.loading{padding:60px 0;text-align:center;color:var(--muted);font:14px var(--f-mono)}
@media (max-width:420px){.hero .big{font-size:64px}.two{grid-template-columns:1fr}.tgt{min-width:54px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand"><b>Skeet Log</b><span id="brandsub">ISSF · 25-target sequence</span></div>

<div id="tip" hidden></div>
<div class="toast" id="toast" hidden></div>
<script src="analytics.js"></script>
<script src="demo.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const w = reg.installing;
        if (w) w.addEventListener('statechange', () => {
          if (w.state === 'installed' && navigator.serviceWorker.controller) {
            const t = document.getElementById('toast'); t.textContent = 'Update installed. Close and reopen to use it.'; t.hidden = false;
            setTimeout(() => { t.hidden = true; }, 5000);
          }
        });
      });
    }).catch(() => {});
  });
}
</script>
